spring.application.name=utility-accounting
server.port=8080

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:utility_accounting_db}
spring.datasource.username=${DB_USER:utility_app_user}
spring.datasource.password=${DB_PASSWORD:secure_pass123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

jwt.secret=${JWT_SECRET:c2VjdXJlLWtleS1mb3Itand0LWFjY2Vzcy1yZWZyZXNoLXRva2Vucy11dGlsaXR5LWFjY291bnRpbmc=}
jwt.access-token-expiration-seconds=${JWT_ACCESS_EXPIRATION:900}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRATION:604800}
